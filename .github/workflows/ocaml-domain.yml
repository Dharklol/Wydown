name: Wydown OCaml Domain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ocaml-domain:
    name: ocaml-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout (immutable action)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned OCaml compiler
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3 resolved commit
        with:
          ocaml-compiler: "5.5.2"
          cache: false
      - name: Install exact direct build dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build domain library with warnings-as-errors
        run: opam exec -- dune build @all --profile release
      - name: Execute domain unit tests
        run: opam exec -- dune runtest --profile release

# Full transitive opam/source/OS lock and reproducible artifact comparison
# are still Stage-3 release gates. Exact compiler + direct deps are a
# bootstrap compatibility check, NOT final production reproducibility.
